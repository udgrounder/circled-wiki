api_version: circled-wiki.reconciliation-contract/v1
kind: reconciliation_contract
metadata:
  name: inbox_reconciliation
  version: 1
  description: >-
    Reconcile normal Inbox items toward Evidence. non_business_confirmed
    disposition is handled outside this contract through reversible quarantine;
    ambiguous or unclassified items remain in the normal inspection flow.
    Capture starts with sensitivity_review: required. The integrated
    Data Protection Review first masks enabled hard-scan values, rechecks those
    categories for misses, masks approved restricted values, and records
    one checksum-bound data_protection_receipt. Only an unresolvable scope,
    masking boundary, or business context awaits the user. The accepted stage
    verifies the Receipt, checksum, Evidence schema, and transition artifacts
    before Evidence conversion. Block reasons are
    requirements; only user-only actions move the contract work to awaiting_user.
spec:
  stages:
    pending:
      profile: inbox-inspection
      action: accept_ready_inbox
      next_stage: accepted
      requires:
        - required_metadata
        - provider_folder
        - content_checksum
        - data_protection_resolved
      on_blocked:
        task_contract: inbox_reconciliation
        reasons:
          sensitivity_review_required:
            current_stage: sensitivity_review
            requested_action: review_data_protection
            resolved_next_action: reprocess_inbox
    accepted:
      profile: evidence-ingest
      action: ingest_accepted
      next_stage: evidence
      requires:
        - accepted_inspection
        - data_protection_receipt
      on_blocked:
        task_contract: inbox_reconciliation
        reasons:
          pii_scan_required:
            current_stage: data_protection
            requested_action: review_data_protection
            resolved_next_action: reprocess_inbox
          pii_needs_review:
            current_stage: data_protection
            requested_action: review_data_protection
            resolved_next_action: reprocess_inbox
          data_protection_required:
            current_stage: data_protection
            requested_action: review_data_protection
            resolved_next_action: reprocess_inbox
