api_version: circled-wiki.reconciliation-contract/v1
kind: reconciliation_contract
metadata:
  name: inbox_reconciliation
  version: 1
  description: >-
    First classify business relevance: only non_business_confirmed items enter
    reversible disposal quarantine; ambiguous items continue to inspection.
    Reconcile remaining Inbox items toward Evidence using existing inspection and
    ingest gates. Human sensitivity and PII review decisions are never inferred.
spec:
  stages:
    pending:
      profile: inbox-inspection
      action: accept_ready_inbox
      next_stage: accepted
      requires:
        - required_metadata
        - provider_folder
        - content_checksum
        - sensitivity_review_resolved
      on_blocked:
        task_contract: inbox_reconciliation
        reasons:
          sensitivity_review_required:
            current_stage: sensitivity_review
            requested_action: complete_sensitivity_review
            resolved_next_action: reprocess_inbox
    accepted:
      profile: evidence-ingest
      action: ingest_accepted
      next_stage: evidence
      requires:
        - accepted_inspection
        - pii_review_not_blocking
      on_blocked:
        task_contract: inbox_reconciliation
        reasons:
          pii_needs_review:
            current_stage: pii_scan
            requested_action: decide_safe_handling
            resolved_next_action: reprocess_inbox
