[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "circled-wiki-runtime"
version = "0.1.0"
description = "Circled Wiki runtime module"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["circled_wiki*"]
